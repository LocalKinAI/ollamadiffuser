      supported_devices:
      - MPS
      performance_notes: Apple Silicon native image editing via mflux. 12B Kontext model at 8-bit MLX
        quant. Requires an input image — pass image=<PIL.Image|path> to generate(). Gated license.
    license_info:
      type: FLUX.1 Non-Commercial License
      requires_agreement: true
      commercial_use: false
  flux.2-klein-4b-edit-mlx:
    repo_id: black-forest-labs/FLUX.2-klein-4B
    # Same layout as the txt2img entry — the weights are the same file set;
    # only the class mflux builds around them differs.
    allow_patterns:
    - "transformer/*.json"
    - "transformer/*.safetensors"
    - "text_encoder/*.json"
    - "text_encoder/*.safetensors"
    - "tokenizer/**"
    - "vae/*.json"
    - "vae/*.safetensors"
    - "*.json"
    # mlx, not flux: the engine dispatches on model_type, and `flux` sends it
    # to the diffusers FluxPipeline, which refuses a repo with no safety
    # checker and never reaches mflux at all.
    model_type: mlx
    variant: mlx-q8
    parameters:
      mlx_variant: flux2-edit
      mlx_model_name: klein-4b
      quantize: 8
      # Distilled: mflux's own defaults, and what the model was trained for.
      # At 28 steps and guidance 3.5 — FLUX.1's numbers — it returns confetti.
      num_inference_steps: 4
      guidance_scale: 1.0
    license_info:
      type: FLUX.2 klein — Apache 2.0
      requires_agreement: false
      commercial_use: true
    hardware_requirements:
      min_vram_gb: 12
      recommended_vram_gb: 16
      min_ram_gb: 16
      recommended_ram_gb: 32
      disk_space_gb: 15
      supported_devices:
      - MPS
      performance_notes: FLUX.2 klein 4B through mflux's edit variant — multi-reference image
        editing, measured at 10–22s for a 768–1024px edit against 181s for FLUX.1-Kontext, from
        half the download and a third of the parameters. Editing only, despite the signature
        taking image_paths=None — mflux 0.19.2 raises a concatenate type error with no reference,
        so drawing a character still needs a txt2img model and this one changes her.
  flux.2-klein-4b-mlx:
    repo_id: black-forest-labs/FLUX.2-klein-4B
    # mflux reads the diffusers layout; flux-2-klein-4b.safetensors
    # at the root is the same 7.2 GB again, for ComfyUI.
    allow_patterns:
    - "transformer/*.json"
    - "transformer/*.safetensors"
    - "text_encoder/*.json"
    - "text_encoder/*.safetensors"
    - "tokenizer/**"
    - "vae/*.json"
    - "vae/*.safetensors"
    - "*.json"
    model_type: mlx
    variant: mlx-q8
    parameters:
      mlx_variant: flux2
      mlx_model_name: klein-4b
      quantize: 8
      # Distilled — 4 steps at guidance 1.0, as mflux defaults them.
      num_inference_steps: 4
      guidance_scale: 1.0
    hardware_requirements:
      min_vram_gb: 6
      recommended_vram_gb: 12
      min_ram_gb: 16
      recommended_ram_gb: 32
      disk_space_gb: 15
      supported_devices:
      - MPS
      performance_notes: Apple Silicon native FLUX.2 4B at 8-bit MLX. Fits Mac Mini M4 16GB UMA. Apache
        2.0 — commercial-friendly.
    license_info:
      type: Apache 2.0
      requires_agreement: false
      commercial_use: true
  flux.2-klein-9b-mlx:
    repo_id: black-forest-labs/FLUX.2-klein-9B
    model_type: mlx
    variant: mlx-q8
    parameters:
      mlx_variant: flux2
      mlx_model_name: klein-9b
      quantize: 8
      # Distilled, like the 4B — 4 steps at guidance 1.0.
      num_inference_steps: 4
      guidance_scale: 1.0
    hardware_requirements:
      min_vram_gb: 12
      recommended_vram_gb: 20
      min_ram_gb: 24
      recommended_ram_gb: 32
      disk_space_gb: 13
      supported_devices:
      - MPS
      performance_notes: Apple Silicon native FLUX.2 9B at 8-bit MLX. Fits Mac Pro M1 32GB; tight on M4
        16GB. Apache 2.0.
    license_info:
