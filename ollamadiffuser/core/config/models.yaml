      commercial_use: true
  ltx-2.3-mlx-q8:
    repo_id: dgrauet/ltx-2.3-mlx-q8
    # Only this entry's own transformer: the pack ships three, one per mode.
    # two-stage: dev for stage 1, and stage 2 either streams the pre-fused distilled file (--low-ram) or fuses the distilled LoRA
    allow_patterns:
    - transformer-dev.safetensors
    - transformer-distilled-1.1.safetensors
    - ltx-2.3-22b-distilled-lora-384-1.1.safetensors
    - connector.safetensors
    - "*vae*.safetensors"
    - vocoder.safetensors
    - "*upscaler*"
    - "*.json"
    - LICENSE
    model_type: ltx-video-mlx
    variant: mlx-int8
    parameters:
      ltx_pack: dgrauet/ltx-2.3-mlx-q8
      mode: two-stage
      frames: 97
      width: 704
      height: 480
      cfg_scale: 3.0
    hardware_requirements:
      min_vram_gb: 24
      recommended_vram_gb: 32
      min_ram_gb: 32
      recommended_ram_gb: 64
      disk_space_gb: 56
      supported_devices:
      - MPS
      performance_notes: LTX-2.3 video on Apple Silicon at int8, through the ltx-2-mlx CLI. Text-to-video
        with 48kHz stereo audio, image-to-video and audio-to-video. 97 frames is 4s at 24 fps; frame
        counts must be 8k+1. Add low_ram=true on a 32 GB Mac. Not an image model — use generate_video().
    license_info:
      type: LTX-2 Community License
      requires_agreement: false
      commercial_use: false
