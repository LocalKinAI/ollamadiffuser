      performance_notes: Apple Silicon native via mflux at 8-bit quant. Typically 2-3x faster than PyTorch+MPS.
        Gated FLUX.1-dev license — set HF_TOKEN before pulling. Requires the [mlx] extra.
    license_info:
      type: FLUX.1 Non-Commercial License
      requires_agreement: true
      commercial_use: false
  flux.1-schnell-mlx-q4:
    repo_id: black-forest-labs/FLUX.1-schnell
    # mflux reads the diffusers layout; the root single-file
