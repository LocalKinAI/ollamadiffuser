    hardware_requirements:
      min_vram_gb: 6
      recommended_vram_gb: 12
      min_ram_gb: 16
      recommended_ram_gb: 24
      disk_space_gb: 8
      supported_devices:
      - MPS
      performance_notes: Apple Silicon native Z-Image-Turbo via mflux. 6B parameters, 8-step DMD, 8-bit
        MLX. Fits Mac Mini M4 16GB. Apache 2.0.
    license_info:
      type: Apache 2.0
      requires_agreement: false
      commercial_use: true
  qwen-image-mlx:
    # mflux's `qwen-image` alias resolves to the 2512 checkpoint. Pulling the
    # original Qwen/Qwen-Image here handed mflux 58 GB of the older weights.
    repo_id: Qwen/Qwen-Image-2512
    model_type: mlx
    variant: mlx-q8
    parameters:
      mlx_variant: qwen-image
      mlx_model_name: qwen-image
      quantize: 8
      num_inference_steps: 30
      guidance_scale: 4.0
    hardware_requirements:
      min_vram_gb: 18
      recommended_vram_gb: 24
      min_ram_gb: 24
      recommended_ram_gb: 64
      disk_space_gb: 58
      supported_devices:
      - MPS
      performance_notes: 20B Qwen-Image at 8-bit MLX. Requires Mac Pro M1 32GB+ — too large for M4 16GB.
        Apache 2.0.
    license_info:
      type: Apache 2.0
      requires_agreement: false
      commercial_use: true
  qwen-image-2.1-mlx:
    # A new architecture (Qwen3-VL-8B text encoder, new VAE), not another
    # qwen-image checkpoint — hence its own mflux family, qwen21 (mflux 0.20.0+).
    # The repo holds only what mflux reads (transformer, text_encoder, vae,
    # processor), so no allow_patterns.
    repo_id: Qwen/Qwen-Image-2.1
    model_type: mlx
    variant: mlx-q8
    parameters:
      mlx_variant: qwen21
      mlx_model_name: qwen-image-2.1
      quantize: 8
      num_inference_steps: 25
      # 1.0 keeps true CFG off: mflux only runs the negative branch when
      # guidance > 1 AND a negative prompt is given, and the engine always
      # sends one — so raising this doubles the time per step.
      guidance_scale: 1.0
    hardware_requirements:
      min_vram_gb: 46
      recommended_vram_gb: 64
      min_ram_gb: 64
      recommended_ram_gb: 96
      disk_space_gb: 34
      supported_devices:
      - MPS
      performance_notes: 'Measured on an M3 Ultra (96 GB), 1024x1024, 25 steps: 104-112 s per
        image, 45.8 GB peak. 4-bit quantization measured the same peak and the same speed, so
        there is no reason to use it. Renders Chinese text correctly.'
    license_info:
      type: Qwen Research License (non-commercial)
      requires_agreement: false
      commercial_use: false
  qwen-image-edit-mlx:
