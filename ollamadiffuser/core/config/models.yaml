# OllamaDiffuser built-in model registry.
#
# This is the source of truth for bundled models. To add a model,
# add an entry under `models:` — no Python changes needed. Contributors
# can submit a model as a pure-data PR against this file.
#
# Schema per entry: repo_id, model_type, (variant), parameters,
# hardware_requirements, license_info. See CONTRIBUTING.md.
#
# User overrides still load from ~/.ollamadiffuser/models.yaml at runtime.
version: 1
models:
  flux.1-dev:
    repo_id: black-forest-labs/FLUX.1-dev
    model_type: flux
    variant: fp16
    parameters:
      num_inference_steps: 20
      guidance_scale: 3.0
      max_sequence_length: 512
    hardware_requirements:
      min_vram_gb: 20
      recommended_vram_gb: 24
      min_ram_gb: 32
      recommended_ram_gb: 64
      disk_space_gb: 24
      supported_devices:
      - CUDA
      performance_notes: Requires significant VRAM. Consider using smaller variants for lower-end hardware.
    license_info:
      type: FLUX.1 Non-Commercial License
      requires_agreement: true
      commercial_use: false
  flux.1-schnell:
    repo_id: black-forest-labs/FLUX.1-schnell
    model_type: flux
    variant: fp16
    parameters:
      num_inference_steps: 4
      guidance_scale: 1.0
      max_sequence_length: 256
    hardware_requirements:
      min_vram_gb: 16
      recommended_vram_gb: 20
      min_ram_gb: 24
      recommended_ram_gb: 32
      disk_space_gb: 24
      supported_devices:
      - CUDA
      - MPS
      performance_notes: Faster variant with fewer steps. Good balance of speed and quality.
    license_info:
      type: Apache 2.0
      requires_agreement: false
      commercial_use: true
  flux.1-kontext-dev:
    repo_id: black-forest-labs/FLUX.1-Kontext-dev
    model_type: flux
    variant: fp16
    parameters:
      pipeline_class: FluxKontextPipeline
      num_inference_steps: 28
      guidance_scale: 2.5
      max_sequence_length: 512
    hardware_requirements:
      min_vram_gb: 20
      recommended_vram_gb: 24
      min_ram_gb: 32
      recommended_ram_gb: 64
      disk_space_gb: 24
      supported_devices:
      - CUDA
      - MPS
      performance_notes: 12B instruction-based image editing model. Pass an input 'image' to the generate
        call along with the edit prompt. Native diffusers FluxKontextPipeline. Top-trending image-edit
        model on HuggingFace.
    license_info:
      type: FLUX.1 Non-Commercial License
      requires_agreement: true
      commercial_use: false
  flux.1-schnell-mlx:
    repo_id: black-forest-labs/FLUX.1-schnell
    model_type: mlx
    variant: mlx-q8
    parameters:
      mlx_variant: flux1
      mlx_model_name: schnell
      quantize: 8
      num_inference_steps: 4
      guidance_scale: 0.0
      max_sequence_length: 256
    hardware_requirements:
      min_vram_gb: 12
      recommended_vram_gb: 16
      min_ram_gb: 16
      recommended_ram_gb: 32
      disk_space_gb: 14
      supported_devices:
      - MPS
      performance_notes: 'Apple Silicon native via mflux. Typically 2-3x faster than the PyTorch+MPS path.
        Apache 2.0. Requires the [mlx] extra: pip install ''ollamadiffuser[mlx]''.'
    license_info:
      type: Apache 2.0
      requires_agreement: false
      commercial_use: true
