      disk_space_gb: 32
      supported_devices:
      - MPS
      performance_notes: Mac Mini M4 16GB friendly. 4-bit MLX quant of FLUX.1-schnell — small quality
        drop vs Q8 but fits ~8GB. Apache 2.0.
    license_info:
      type: Apache 2.0
      requires_agreement: false
      commercial_use: true
  flux.1-kontext-dev-mlx:
    repo_id: black-forest-labs/FLUX.1-Kontext-dev
    # mflux reads the diffusers layout; the root single-file
    # checkpoint is the same weights again, for ComfyUI.
    allow_patterns:
    - "transformer/*.json"
    - "transformer/*.safetensors"
    - "text_encoder/*.json"
    - "text_encoder/*.safetensors"
    - "text_encoder_2/*.json"
    - "text_encoder_2/*.safetensors"
    - "tokenizer/**"
    - "tokenizer_2/**"
    - "vae/*.json"
