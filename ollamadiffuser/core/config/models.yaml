    - "text_encoder/*.json"
    - "text_encoder/*.safetensors"
    - "text_encoder_2/*.json"
    - "text_encoder_2/*.safetensors"
    - "tokenizer/**"
    - "tokenizer_2/**"
    - "vae/*.json"
    - "vae/*.safetensors"
    - "*.json"
    model_type: mlx
    variant: mlx-q8
    parameters:
